spring:
  application:
    name: backend
  datasource:
    url: ${SUPABASE_DB_URL}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  cors:
    # 배포 시 프론트 도메인만 콤마로 지정(예: https://tripmaker.vercel.app). 로컬 기본값은 전체 허용.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 60

ai:
  api-key: ${AI_API_KEY}
  model: ${AI_MODEL:claude-haiku-4-5-20251001}
  base-url: ${AI_BASE_URL:https://api.anthropic.com/v1/messages}
