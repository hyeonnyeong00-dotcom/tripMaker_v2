# Render Blueprint — backend(Docker) 배포 정의
# 사용: Render 대시보드 → New → Blueprint → 이 저장소 선택 → 아래 sync:false 시크릿 값 입력.
# 프론트(Vercel) 배포 후, APP_CORS_ALLOWED_ORIGINS를 실제 Vercel 도메인으로 채운다.
services:
  - type: web
    name: tripmaker-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Supabase Postgres JDBC 연결 문자열 (sslmode=require 포함)
      - key: SUPABASE_DB_URL
        sync: false
      # HS256 서명 키 — 반드시 32바이트(256bit) 이상 임의 문자열
      - key: JWT_SECRET
        sync: false
      # Anthropic API 키 (sk-ant-...)
      - key: AI_API_KEY
        sync: false
      # 저비용 모델(기본값). 필요 시 변경
      - key: AI_MODEL
        value: claude-haiku-4-5-20251001
      # 프론트 도메인만 허용. Vercel 배포 후 실제 URL로 교체 (예: https://tripmaker.vercel.app)
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
